on:
  push:

name: Secret Leaks

permissions:
  contents: read

jobs:
  trufflehog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve base commit
        id: base-ref
        run: |
          if [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ] && [ -n "${{ github.event.before }}" ]; then
            echo "base=${{ github.event.before }}" >> $GITHUB_OUTPUT
          else
            echo "base=$(git merge-base origin/${{ github.event.repository.default_branch }} HEAD || git rev-parse origin/${{ github.event.repository.default_branch }} || git rev-parse HEAD~1)" >> $GITHUB_OUTPUT
          fi
      - name: Secret Scanning
        uses: trufflesecurity/trufflehog@d411fff7b8879a62509f3fa98c07f247ac089a51  # main
        with:
          base: ${{ steps.base-ref.outputs.base }}
          head: ${{ github.sha }}
          # Lob's detector matches `(live|test)_<35 hex>` and false-positives under CF 403 blocks.
          extra_args: --results=verified,unknown --exclude-detectors=lob --fail-on-scan-errors
